# The model catalog: every model the service serves, and how to load each
# precision of it. This file is the built-in default; point
# PARAKEET_MODEL_CATALOG at another YAML file (a k8s ConfigMap, say) to replace
# it wholesale. The service validates the whole file at startup and refuses to
# start on a mistake.
#
# `languages` holds shared lists as YAML anchors (&name), which entries reference
# as *name; the service itself only reads `models` and `aligners`. Quote every
# language code: a bare no (Norwegian) is YAML for false.
#
# One entry per model: what every precision of it shares (family, the
# onnx-asr model type that runs it, languages, chunk lengths) and, per
# quantization, the repo and the commit it is pinned to. An upstream change
# reaches us only when a revision is bumped.
#
# By default a quantization loads the files onnx-asr
# (https://github.com/istupakov/onnx-asr) reads from where fp32 exports of that
# model type keep them (ONNX_ASR_DEFAULT_FILES in config.py): for Parakeet
# encoder-model.onnx and decoder_joint-model.onnx at the repo root, for Whisper
# onnx/encoder_model.onnx and onnx/decoder_model_merged.onnx, plus the vocab and
# config files at the root. `files` names whatever differs, mapping the name
# onnx-asr reads to the path in the repo: every other precision's model files,
# and any external-data files, under the name their .onnx refers to (nothing is
# looked up). Two quantizations of a model that would load the same files are
# refused, which catches a `files` left out.
#
# A request names the model and may pick a quantization; without one it gets
# fp32, the reference precision, whatever the hardware. FP16 halves VRAM on a
# GPU but ONNX Runtime upcasts it on CPU, which is slower. istupakov's
# parakeet-v3 int8 measurably dropped words after silences; see the
# parakeet-v3 entry for what replaced it.
#
# Whisper repos are onnx-community's except where its export is broken (#35):
# the bare medium and large-v3 repos are empty (the exports live under -ONNX),
# there is no medium.en, and the .en fp16 merged decoders fail onnxruntime's
# graph check. Those come from Xenova, whose 8-bit files are _quantized (it has
# no int8 encoder); Xenova's medium.en also carries a stale 2023-05
# decoder_model_merged.onnx_data that its self-contained decoder never reads.
# The Whisper encoder sees a fixed 30 s window and the export silently drops
# audio past it, so a longer chunk would lose its tail. Whisper returns text
# only; word times come from forced alignment of the transcript (#26).
#
# Every entry lists the languages it transcribes: served on its model card, and
# ["en"] marks an English-only model whose word times the aligner may take.
# Every entry states the chunk length long audio is cut to: "chunk_target_sec"
# preferred, "chunk_max_sec" at most (and audio no longer than that is not cut
# at all). Parakeet v2, fp32 and int8 alike, hears whole stretches of clear
# speech in a chunk of 45 s or more as silence, which ones depending
# chaotically on where the chunk starts; no 20 or 30 s chunk did (#36).
# Parakeet v3 is the other way round: it loses more speech in 20-30 s chunks
# than in 60 s ones.

languages:
  parakeet-v3: &parakeet-v3 [
    "bg", "hr", "cs", "da", "nl", "en", "et", "fi", "fr", "de", "el", "hu", "it", "lv",
    "lt", "mt", "pl", "pt", "ro", "ru", "sk", "sl", "es", "sv", "uk"
  ]
  whisper: &whisper [
    "en", "zh", "de", "es", "ru", "ko", "fr", "ja", "pt", "tr", "pl", "ca", "nl", "ar",
    "sv", "it", "id", "hi", "fi", "vi", "he", "uk", "el", "ms", "cs", "ro", "da", "hu",
    "ta", "no", "th", "ur", "hr", "bg", "lt", "la", "mi", "ml", "cy", "sk", "te", "fa",
    "lv", "bn", "sr", "az", "sl", "kn", "et", "mk", "br", "eu", "is", "hy", "ne", "mn",
    "bs", "kk", "sq", "sw", "gl", "mr", "pa", "si", "km", "sn", "yo", "so", "af", "oc",
    "ka", "be", "tg", "sd", "gu", "am", "yi", "lo", "uz", "fo", "ht", "ps", "tk", "nn",
    "mt", "sa", "lb", "my", "bo", "tl", "mg", "as", "tt", "haw", "ln", "ha", "ba",
    "jw", "su"
  ]
  english: &english ["en"]

models:
  # parakeet-v3's three precisions are Olicorne's re-export of NVIDIA's .nemo
  # checkpoint (#42), picked on CPU only: on the #36 English chapter (648 s)
  # fp32/fp16/int8 scored 1.13/1.07/1.20% WER against 1.20/1.20/1.83% for the
  # exports they replaced; int8 also ran ~25% faster, fp32 the same speed.
  # NOT TESTED ON A GPU. If CUDA misbehaves (a load error;
  # PARAKEET_USE_GPU=true refusing a session that didn't bind to CUDA; int8
  # slow because its 8-bit MatMulNBits nodes fall back to CPU; fp16 output
  # drifting from fp32), put that precision back to what it was before #42
  # (onnx-asr's standard file names at the repo root):
  #   fp32  istupakov/parakeet-tdt-0.6b-v3-onnx  8f23f0c03c8761650bdb5b40aaf3e40d2c15f1ce
  #         encoder-model.onnx + encoder-model.onnx.data, decoder_joint-model.onnx
  #   fp16  grikdotnet/parakeet-tdt-0.6b-fp16    dc9871ec5ad84a420940077e76e8741b3609bf8b
  #         encoder-model.fp16.onnx, decoder_joint-model.fp16.onnx
  #   int8  istupakov/parakeet-tdt-0.6b-v3-onnx  8f23f0c03c8761650bdb5b40aaf3e40d2c15f1ce
  #         encoder-model.int8.onnx, decoder_joint-model.int8.onnx
  #   (each also vocab.txt and config.json from the same repo)
  parakeet-v3:
    family: parakeet
    onnx_asr_type: nemo-conformer-tdt
    languages: *parakeet-v3
    chunk_target_sec: 60.0
    chunk_max_sec: 75.0
    quantizations:
      fp32:
        repo: Olicorne/parakeet-tdt-0.6b-v3-optimized-onnx
        revision: "9d104194420cfe48c3374385bb42b42a788b9225"
        files:
          encoder-model.onnx: fp32/encoder-model.onnx
          encoder-model.onnx.data.000: fp32/encoder-model.onnx.data.000
          encoder-model.onnx.data.001: fp32/encoder-model.onnx.data.001
          decoder_joint-model.onnx: fp32/decoder_joint-model.onnx
          decoder_joint-model.onnx.data: fp32/decoder_joint-model.onnx.data
      fp16:
        # Olicorne ships no fp16 decoder; its README pairs the fp16 encoder
        # with the fp32 one (73 MB), which is what was measured.
        repo: Olicorne/parakeet-tdt-0.6b-v3-optimized-onnx
        revision: "9d104194420cfe48c3374385bb42b42a788b9225"
        files:
          encoder-model.onnx: fp16/encoder-model.fp16.onnx
          decoder_joint-model.onnx: fp32/decoder_joint-model.onnx
          decoder_joint-model.onnx.data: fp32/decoder_joint-model.onnx.data
      int8:
        repo: Olicorne/parakeet-tdt-0.6b-v3-optimized-onnx
        revision: "9d104194420cfe48c3374385bb42b42a788b9225"
        files:
          encoder-model.onnx: int8/encoder-model.int8.onnx
          decoder_joint-model.onnx: int8/decoder_joint-model.int8.onnx
  parakeet-v2:
    family: parakeet
    onnx_asr_type: nemo-conformer-tdt
    languages: *english
    chunk_target_sec: 25.0
    chunk_max_sec: 30.0
    quantizations:
      fp32:
        repo: istupakov/parakeet-tdt-0.6b-v2-onnx
        revision: "0bbb45a3365852604aef28b538a8f066f4ccaa85"
        files:
          encoder-model.onnx.data: encoder-model.onnx.data
      fp16:
        repo: ysdede/parakeet-tdt-0.6b-v2-onnx
        revision: "db4a768f5795e0f508187a34241fbeeef6ebb0d3"
        files:
          encoder-model.onnx: encoder-model.fp16.onnx
          decoder_joint-model.onnx: decoder_joint-model.fp16.onnx
      int8:
        repo: istupakov/parakeet-tdt-0.6b-v2-onnx
        revision: "0bbb45a3365852604aef28b538a8f066f4ccaa85"
        files:
          encoder-model.onnx: encoder-model.int8.onnx
          decoder_joint-model.onnx: decoder_joint-model.int8.onnx
  whisper-tiny:
    family: whisper
    onnx_asr_type: whisper
    languages: *whisper
    chunk_target_sec: 25.0
    chunk_max_sec: 30.0
    quantizations:
