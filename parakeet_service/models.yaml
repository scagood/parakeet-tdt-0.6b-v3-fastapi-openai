        repo: onnx-community/whisper-tiny
        revision: "ff4177021cc41f7db950912b73ea4fdf7d01d8e7"
      fp16:
        repo: onnx-community/whisper-tiny
        revision: "ff4177021cc41f7db950912b73ea4fdf7d01d8e7"
