name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        # numpy unpinned here: requirements.txt caps it at <3, so pip resolves
        # the same 2.x series the runtime installs.
        # fastapi + python-multipart: tests import parakeet_service.routes.
        run: python -m pip install --upgrade pip numpy pytest pytest-asyncio psutil fastapi python-multipart
      - name: Compile service
        run: python -m compileall -q parakeet_service server.py
      - name: Run unit tests
        run: pytest -q tests
