name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        # numpy unpinned here (requirements.txt pins <2 for the runtime):
        # numpy 1.26 has no wheels for 3.13+, and the unit tests pass on both.
        # fastapi + python-multipart: tests import parakeet_service.routes.
        run: python -m pip install --upgrade pip numpy pytest pytest-asyncio psutil fastapi python-multipart
      - name: Compile service
        run: python -m compileall -q parakeet_service server.py
      - name: Run unit tests
        run: pytest -q tests
