name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile.*"
      - "requirements.txt"
      - ".github/workflows/docker.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Named explicitly so the check name stays `build (cpu)` / `build (gpu)`
    # instead of tracking the matrix's platform strings.
    name: build (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platforms` is what a pull request builds, `publish_platforms` what
          # a push to main or a tag publishes. linux/arm64 is emulated under
          # QEMU and cost ~11 of the job's ~20 minutes, which is worth paying
          # on the images people pull and not on every pull request. The
          # tradeoff is that an arm64-only build break surfaces on main rather
          # than on the pull request that caused it.
          - flavor: cpu
            platforms: linux/amd64
            publish_platforms: linux/amd64,linux/arm64
          - flavor: gpu
            # onnxruntime-gpu has no aarch64 wheels on PyPI, so GPU is
            # amd64-only either way
            platforms: linux/amd64
            publish_platforms: linux/amd64
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      # Only the published cpu image needs emulation; pull request builds are
      # native amd64.
      - uses: docker/setup-qemu-action@v4
        if: github.event_name != 'pull_request' && matrix.flavor == 'cpu'

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-${{ matrix.flavor }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.flavor }}
          platforms: ${{ github.event_name == 'pull_request' && matrix.platforms || matrix.publish_platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          # Export the cache only on pushes to main and tags. A pull request
          # cannot read another PR's cache, so exporting there spent ~8 minutes
          # writing a cache nothing would ever restore; PR builds still read
          # main's.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.flavor) || '' }}
