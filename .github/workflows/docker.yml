name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile.*"
      - "requirements.txt"
      - ".github/workflows/docker.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both images are amd64-only, so buildx builds natively and no QEMU
          # setup is needed. The CPU image used to add linux/arm64, which was
          # emulated and took ~11 of the job's ~20 minutes; deployment targets
          # are amd64, so it is dropped until an arm64 host needs it.
          - flavor: cpu
            platforms: linux/amd64
          - flavor: gpu
            # onnxruntime-gpu has no aarch64 wheels on PyPI anyway
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-${{ matrix.flavor }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.flavor }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          # Export the cache only on pushes to main and tags. A pull request
          # cannot read another PR's cache, so exporting there spent ~8 minutes
          # writing a cache nothing would ever restore; PR builds still read
          # main's.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.flavor) || '' }}
