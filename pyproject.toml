# Project metadata. The service is run from source (`python server.py`) with
# dependencies from requirements.txt, so this file is not a build recipe and
# declares no build backend: it exists to state the supported interpreter in
# one machine-readable place. `pip`, `uv` and most tooling read
# `requires-python` and refuse to install into an older interpreter.
[project]
name = "stt-api"
version = "2.0.0"  # x-release-please-version
description = "OpenAI-compatible speech-to-text server on ONNX Runtime"
requires-python = ">=3.14"
